<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f4f7fb">
    <meta name="description" content="NexaGuard helps inspect suspicious links and email files with local security analysis.">
    <title>{% block title %}NexaGuard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="bg-glow glow-one"></div>
<div class="bg-glow glow-two"></div>

<header class="topbar">
    <a class="brand" href="/">
        <span class="brand-icon" aria-hidden="true">N</span>
        <span>Nexa<span>Guard</span></span>
    </a>
    <div class="status"><i></i> LOCAL ANALYSIS</div>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer><span class="footer-mark">N</span> NexaGuard <span class="footer-separator">·</span> Link and email security workspace</footer>
</body>
</html>
